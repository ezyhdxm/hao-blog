<!DOCTYPE html>
<html lang="{{ page.lang | default: site.lang | default: 'en' }}">

  {% include head.html %}

  <body>
    <script>
      (function () {
        var savedTheme = null;
        try {
          savedTheme = localStorage.getItem("theme-preference");
        } catch (e) {}

        var useDark = false;
        if (savedTheme === "dark") {
          useDark = true;
        } else if (savedTheme === "light") {
          useDark = false;
        } else if (window.matchMedia) {
          useDark = window.matchMedia("(prefers-color-scheme: dark)").matches;
        }

        if (useDark) {
          document.body.classList.add("dark-mode");
        }
      })();
    </script>

    {% include header.html %}

    <script>
      function myFunction() {
        var x = document.getElementById("navbar");
        if (x.className === "site-navi") {
          x.className += " responsive";
        } else {
          x.className = "site-navi";
        }
      }
    </script>

    <script>
      (function () {
        function applyThemeLabel() {
          var btn = document.getElementById("theme-toggle");
          if (!btn) return;
          var darkOn = document.body.classList.contains("dark-mode");
          var icon = btn.querySelector(".toggle-icon");
          var text = btn.querySelector(".toggle-text");
          if (icon) icon.innerHTML = darkOn ? "&#9788;" : "&#9790;";
          if (text) text.textContent = darkOn ? "Light" : "Dark";
          btn.setAttribute("aria-pressed", darkOn ? "true" : "false");
        }

        function toggleTheme() {
          var darkOn = document.body.classList.toggle("dark-mode");
          try {
            localStorage.setItem("theme-preference", darkOn ? "dark" : "light");
          } catch (e) {}
          applyThemeLabel();
        }

        document.addEventListener("DOMContentLoaded", function () {
          var btn = document.getElementById("theme-toggle");
          if (!btn) return;
          btn.addEventListener("click", toggleTheme);
          applyThemeLabel();
        });
      })();
    </script>

    <main class="page-content" aria-label="Content">
      {% if page.lang %}
      <div class="post" lang="{{page.lang}}">
      {% else %}
      <div class="post">
      {% endif %}
        <div class="wrapper">
          <div class="right-content">
            {{ content }}
          </div>
        </div>
      </div>
    </main>

    {% include footer.html %}

  </body>

</html>
