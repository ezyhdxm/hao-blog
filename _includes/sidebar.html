<div class="sidebar">
    <div class="container sidebar-sticky">
        <div class="sidebar-about">
            <!--p class="lead">{{ site.description }}</p-->
        </div>
        <div class="menu-box">
            <input type="checkbox" id="menu-icon">
            <label class="menu-label" for="menu-icon"></label>
            <div class="trigger">
                <ul class="sidebar-nav">
                    <a class="sidebar-nav-item{% if page.url == '/' %} active{% endif %}" href="{{ '/' | relative_url }}">Home</a>
                    {% assign pages_list = site.pages %}
                    {% for node in pages_list %}
                    {% if node.title != null %}
                        {% if node.layout == "page" %}
                        <a class="sidebar-nav-item{% if page.url == node.url %} active{% endif %}" href="{{ node.url | relative_url }}">{{ node.title }}</a>
                        {% endif %}
                    {% endif %}
                    {% endfor %}
                    <a class="sidebar-nav-item" href="{{ site.github.repo }}">GitHub project</a>
                </ul>
            </div>
        </div>
            <!--span class="sidebar-nav-item">Currently v{{ site.version }}</span>   

                <p>&copy; {{ site.time | date: '%Y' }}. All rights reserved.</p-->
    </div>
</div>
